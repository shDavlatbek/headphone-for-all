# Weekly dependency updates. Minor and patch bumps are grouped into one pull request per
# ecosystem; major bumps come one per dependency.
#
# flutter_rust_bridge is pinned to the exact codegen version (=2.13.0 in core/Cargo.toml,
# 2.13.0 in app/pubspec.yaml, FRB_VERSION in .github/workflows/flutter.yml). All three plus the
# generated bindings must move together, so Dependabot leaves it alone (see docs/BUILDING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: flutter_rust_bridge
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: flutter_rust_bridge
    groups:
      pub-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

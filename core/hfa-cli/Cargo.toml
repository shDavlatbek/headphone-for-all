[package]
name = "hfa-cli"
description = "headphone-for-all headless command-line hub/sender and selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hfa"
path = "src/main.rs"

[features]
default = ["bundled-opus"]
# Build libopus from bundled source (static). Disable to link the system libopus.
bundled-opus = ["hfa-core/bundled-opus"]

[dependencies]
hfa-proto = { workspace = true }
hfa-audio = { workspace = true }
hfa-capture = { workspace = true }
hfa-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
qrcode = { workspace = true }
# Temporary data dirs and WAV of `hfa selftest`.
tempfile = { workspace = true }
